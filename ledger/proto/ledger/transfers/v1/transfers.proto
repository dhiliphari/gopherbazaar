syntax = "proto3";

package ledger.transfers.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gopherbazaar/ledger/gen/ledger/transfers/v1;transfersv1";

service TransfersService {
    rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
    rpc GetTransfer(GetTransferRequest) returns (GetTransferResponse);
    rpc GetTransferStats(GetTransferStatsRequest) returns (GetTransferStatsResponse);
}

enum TransferStatus {
    TRANSFER_STATUS_UNSPECIFIED = 0;
    TRANSFER_STATUS_PENDING = 1;
    TRANSFER_STATUS_DEBITED = 2;
    TRANSFER_STATUS_COMPLETED = 3;
    TRANSFER_STATUS_FAILED = 4;
    TRANSFER_STATUS_REFUNDED = 5;
}

message Transfer {
    int64 id = 1;
    int64 from_account_id = 2;
    int64 to_account_id = 3;
    int64 amount = 4;
    TransferStatus status = 5;
    string last_error = 6;
    google.protobuf.Timestamp create_time = 7;
    google.protobuf.Timestamp update_time = 8;
}

message CreateTransferRequest {
    int64 from_account_id = 1;
    int64 to_account_id = 2;
    int64 amount = 3;
}

message CreateTransferResponse {
    Transfer transfer = 1;
}

message GetTransferRequest {
  int64 id = 1;
}

message GetTransferResponse {
  Transfer transfer = 1;
}

message GetTransferStatsRequest {}

message GetTransferStatsResponse {
  // Count of transfers by status name ("pending", "completed", ...).
  map<string, int64> by_status = 1;
  // Money debited from senders but not yet credited to receivers.
  int64 in_flight = 2;
}